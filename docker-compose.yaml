services:
  lamassu-server:
    build:
      context: .
      dockerfile: build/server.Dockerfile
      target: l-s
    restart: on-failure
    ports:
      - 3000:3000
    volumes:
      - ./lamassu-data:/lamassu-data
    environment:
      - NODE_ENV=production
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=lamassu
      - CA_PATH=/lamassu-data/certs/Lamassu_OP_Root_CA.pem
      - CERT_PATH=/lamassu-data/certs/Lamassu_OP.pem
      - KEY_PATH=/lamassu-data/private/Lamassu_OP.key
      - MNEMONIC_PATH=/lamassu-data/mnemonics/mnemonic.txt
      - OFAC_DATA_DIR=/lamassu-data/ofac
      - ID_PHOTO_CARD_DIR=/lamassu-data/idphotocard
      - FRONT_CAMERA_DIR=/lamassu-data/frontcamera
      - OPERATOR_DATA_DIR=/lamassu-data/operatordata
      - COIN_ATM_RADAR_URL=https://coinatmradar.info/api/lamassu/
      - HOSTNAME=127.0.0.1
      - LOG_LEVEL=info

  lamassu-admin-server:
    build:
      context: .
      dockerfile: build/server.Dockerfile
      target: l-a-s
    restart: on-failure
    ports:
      - 443:443
    volumes:
      - ./lamassu-data:/lamassu-data
    environment:
      - NODE_ENV=production
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=lamassu
      - CA_PATH=/lamassu-data/certs/Lamassu_OP_Root_CA.pem
      - CERT_PATH=/lamassu-data/certs/Lamassu_OP.pem
      - KEY_PATH=/lamassu-data/private/Lamassu_OP.key
      - MNEMONIC_PATH=/lamassu-data/mnemonics/mnemonic.txt
      - OFAC_DATA_DIR=/lamassu-data/ofac
      - ID_PHOTO_CARD_DIR=/lamassu-data/idphotocard
      - FRONT_CAMERA_DIR=/lamassu-data/frontcamera
      - OPERATOR_DATA_DIR=/lamassu-data/operatordata
      - COIN_ATM_RADAR_URL=https://coinatmradar.info/api/lamassu/
      - HOSTNAME=127.0.0.1
      - LOG_LEVEL=info
    depends_on:
      lamassu-server:
        condition: service_started
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=lamassu
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: